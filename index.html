<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grazzi's Hot Spot · Live Results</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8001d;
    --red-dim: #8b0011;
    --gold: #ffd000;
    --bg: #0a0a0c;
    --surface: #111115;
    --surface2: #1a1a20;
    --border: #2a2a35;
    --text: #e8e8f0;
    --muted: #666680;
    --ball-size: 34px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(232,0,29,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,0,29,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  header {
    position: relative; z-index: 1;
    padding: 28px 24px 20px;
    display: flex; align-items: flex-end;
    justify-content: space-between; flex-wrap: wrap; gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 44px; height: 44px; background: var(--red); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', cursive; font-size: 18px; color: white;
    box-shadow: 0 0 20px rgba(232,0,29,0.5); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100%{box-shadow:0 0 20px rgba(232,0,29,0.5)}
    50%{box-shadow:0 0 35px rgba(232,0,29,0.8)}
  }
  .logo-title { font-family: 'Bebas Neue', cursive; font-size: 28px; letter-spacing: 3px; line-height:1; }
  .logo-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .status-bar { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 8px; height: 8px; background: #00e676; border-radius: 50%; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .refresh-btn {
    background: var(--red); color: white; border: none;
    padding: 10px 22px; font-family: 'Bebas Neue', cursive;
    font-size: 16px; letter-spacing: 2px; cursor: pointer;
    border-radius: 4px; transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .refresh-btn:hover { background:#ff1a35; transform:translateY(-1px); box-shadow:0 4px 16px rgba(232,0,29,0.4); }
  .refresh-btn:disabled { background:var(--red-dim); cursor:not-allowed; transform:none; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .controls {
    position:relative; z-index:1; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  .count-label { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
  .count-label span { color:var(--gold); font-weight:600; }
  .last-updated { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .progress-wrap { position:relative; z-index:1; padding:0 24px 14px; }
  .progress-bar-bg { background:var(--surface2); border-radius:4px; height:4px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:var(--red); width:0%; transition:width 0.25s ease; border-radius:4px; }
  .progress-label { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); margin-top:5px; }
  .header-row {
    display:grid; grid-template-columns:100px 130px 1fr 80px;
    gap:12px; padding:6px 18px;
    position:relative; z-index:1; margin:0 24px;
  }
  .col-header { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .results-grid { position:relative; z-index:1; padding:0 24px 48px; display:flex; flex-direction:column; gap:2px; }
  .draw-row {
    background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:12px 16px;
    display:grid; grid-template-columns:100px 130px 1fr 80px;
    align-items:center; gap:12px;
    transition:background 0.15s;
    animation:slideIn 0.3s ease both;
  }
  .draw-row:hover { background:var(--surface2); }
  .draw-row.newest { border-color:var(--red-dim); }
  @keyframes slideIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  .draw-num { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .draw-time { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text); font-weight:600; }
  .draw-time-sub { font-size:10px; color:var(--muted); font-weight:400; }
  .balls-container { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .ball {
    width:var(--ball-size); height:var(--ball-size); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    color:#0a0a0c; flex-shrink:0;
  }
  .ball[data-r="1"]{background:#ff6b6b}
  .ball[data-r="2"]{background:#ff9f43}
  .ball[data-r="3"]{background:#ffd000}
  .ball[data-r="4"]{background:#a3e635}
  .ball[data-r="5"]{background:#34d399}
  .ball[data-r="6"]{background:#22d3ee}
  .ball[data-r="7"]{background:#818cf8}
  .ball[data-r="8"]{background:#e879f9}
  .bullseye-cell { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .bullseye-lbl { font-family:'IBM Plex Mono',monospace; font-size:8px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
  .ball.bullseye { background:var(--gold); --ball-size:36px; font-size:12px; box-shadow:0 0 10px rgba(255,208,0,0.5); }
  .loading-state,.error-state { text-align:center; padding:60px 24px; position:relative; z-index:1; }
  .loading-spinner { width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px; }
  .loading-text { font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:2px; }
  .error-icon { font-size:48px;margin-bottom:16px; }
  .error-title { font-family:'Bebas Neue',cursive;font-size:24px;color:var(--red);letter-spacing:2px;margin-bottom:8px; }
  .error-msg { font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);max-width:500px;margin:0 auto 24px;line-height:1.7; }
  .error-msg code { background:var(--surface2);padding:2px 6px;border-radius:3px; }
  @media(max-width:680px){
    .draw-row,.header-row{grid-template-columns:1fr}
    .header-row{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">HS</div>
    <div>
      <div class="logo-title">Grazzi's Hot Spot</div>
      <div class="logo-sub">California Lottery · Results Tracker</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-bar">
      <div class="live-dot"></div>
      <span>DRAWS EVERY 4 MIN</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadResults()">
      <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      REFRESH
    </button>
  </div>
</header>

<div class="controls">
  <div class="count-label">Showing last <span id="countDisplay">—</span> draws</div>
  <div class="last-updated" id="lastUpdated">Not yet loaded</div>
</div>

<div class="progress-wrap" id="progressWrap" style="display:none">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Starting...</div>
</div>

<div class="header-row">
  <div class="col-header">Draw #</div>
  <div class="col-header">Date / Time</div>
  <div class="col-header">Winning Numbers (1–80)</div>
  <div class="col-header">Bulls-eye</div>
</div>

<div id="main"></div>

<script>
  const PROXY = 'https://corsproxy.io/?';
  const BASE  = 'https://www.calottery.com/en/draw-games/hot-spot/past-winning-numbers';
  const DRAWS_TO_FETCH = 10;
  let lastKnownDrawNumber = null; // updated each refresh to track true latest

  function colorRange(n) {
    if (n <= 10) return '1';
    if (n <= 20) return '2';
    if (n <= 30) return '3';
    if (n <= 40) return '4';
    if (n <= 50) return '5';
    if (n <= 60) return '6';
    if (n <= 70) return '7';
    return '8';
  }

  function parsePage(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const bodyText = doc.body ? (doc.body.innerText || doc.body.textContent) : '';

    // Draw number — 7-digit number after "Draw Number:"
    const drawNumMatch = bodyText.match(/Draw Number:\s*(\d{7})/);
    const drawNumber = drawNumMatch ? drawNumMatch[1] : null;

    // Date and time
    const dateMatch = bodyText.match(/Draw Date:\s*([A-Za-z]+\s+\d+,\s*\d{4})/);
    const timeMatch = bodyText.match(/Draw Time:\s*([\d]+:[\d]+\s*[apm.]+)/i);
    const drawDate = dateMatch ? dateMatch[1].trim() : '';
    const drawTime = timeMatch ? timeMatch[1].replace(/\./g,'').trim() : '';

    // Winning numbers: Hot Spot draws exactly 20 numbers. Only parse <ul> list items (ignore <ol> 1-10 spots selector). Cap at 20.
    const numbers = [];
    doc.querySelectorAll('ul li').forEach(li => {
      const t = li.textContent.trim();
      const n = parseInt(t);
      if (!isNaN(n) && n >= 1 && n <= 80 && t === String(n) && numbers.length < 20) {
        numbers.push(n);
      }
    });

    // Bulls-eye: the page text contains "Bulls-eye number is {number} X"
    // The {number} is a template placeholder so we grab the digit after it
    const bsMatch = bodyText.match(/Bulls-eye number is \{number\}\s*(\d+)/i);
    const bullseye = bsMatch ? parseInt(bsMatch[1]) : null;

    // Remove bullseye from numbers array if it got included
    const winningNumbers = bullseye ? numbers.filter(n => n !== bullseye) : numbers;

    return { drawNumber, drawDate, drawTime, numbers: winningNumbers, bullseye };
  }

  async function fetchDraw(drawId) {
    const url = drawId ? `${BASE}?query=${drawId}` : BASE;
    const res = await fetch(PROXY + encodeURIComponent(url));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const html = await res.text();
    return parsePage(html);
  }

  function renderBall(n, cls = '') {
    return `<div class="ball ${cls}" data-r="${colorRange(n)}">${n}</div>`;
  }

  function renderRow(draw, index) {
    const balls = (draw.numbers || []).map(n => renderBall(n)).join('');
    const bsHtml = draw.bullseye
      ? `<div class="bullseye-lbl">BULLS-EYE</div>${renderBall(draw.bullseye, 'bullseye')}`
      : `<div class="bullseye-lbl">BULLS-EYE</div><span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px">—</span>`;

    return `
      <div class="draw-row ${index === 0 ? 'newest' : ''}" style="animation-delay:${Math.min(index*0.015,0.4)}s">
        <div class="draw-num">#${draw.drawNumber || '—'}</div>
        <div>
          <div class="draw-time">${draw.drawTime || '—'}</div>
          <div class="draw-time draw-time-sub">${draw.drawDate || '—'}</div>
        </div>
        <div class="balls-container">${balls}</div>
        <div class="bullseye-cell">${bsHtml}</div>
      </div>
    `;
  }

  function setProgress(done, total) {
    const pct = Math.round((done / total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `Fetching draw ${done} of ${total}...`;
  }

  async function loadResults() {
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    const main = document.getElementById('main');
    const progressWrap = document.getElementById('progressWrap');

    btn.disabled = true;
    icon.classList.add('spin');
    progressWrap.style.display = 'block';
    setProgress(0, DRAWS_TO_FETCH);

    main.innerHTML = `
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">FETCHING LATEST DRAW...</div>
      </div>`;

    try {
      const draws = [];

      // Calculate the current draw number from the clock.
      // Anchor: draw #3242873 = March 3, 2026 at 1:56 PM PT
      // Draws run every 4 minutes, 6:00 AM – 2:00 AM PT (240 draws/day)
      const ANCHOR_DRAW = 3242873;
      const ANCHOR_TIME = new Date('2026-03-03T13:56:00-08:00').getTime();
      const DRAW_INTERVAL_MS = 4 * 60 * 1000; // 4 minutes

      const nowPT = Date.now();
      const msSinceAnchor = nowPT - ANCHOR_TIME;
      const drawsSinceAnchor = Math.floor(msSinceAnchor / DRAW_INTERVAL_MS);
      let latestId = ANCHOR_DRAW + drawsSinceAnchor;

      // Hot Spot only runs 6:00 AM – 2:00 AM PT. If currently in the off window (2am–6am),
      // the last draw of the previous session was at 2:00 AM.
      // We subtract 1 so we don't request a draw that hasn't happened yet.
      latestId = latestId - 1;

      lastKnownDrawNumber = latestId;

      const first = await fetchDraw(latestId);
      if (!first.drawNumber) throw new Error('Could not fetch draw #' + latestId);
      draws.push(first);
      setProgress(1, DRAWS_TO_FETCH);

      // Walk back sequentially — Hot Spot draw numbers are consecutive integers
      let currentId = latestId - 1;

      for (let i = 1; i < DRAWS_TO_FETCH; i++) {
        try {
          const draw = await fetchDraw(currentId);
          draws.push(draw);
        } catch (e) {
          console.warn(`Skipped draw ${currentId}:`, e.message);
        }
        currentId--;
        setProgress(i + 1, DRAWS_TO_FETCH);
        await new Promise(r => setTimeout(r, 100)); // be polite
      }

      progressWrap.style.display = 'none';
      document.getElementById('countDisplay').textContent = draws.length;
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});

      main.innerHTML = `<div class="results-grid">${draws.map((d,i) => renderRow(d,i)).join('')}</div>`;

    } catch (err) {
      progressWrap.style.display = 'none';
      main.innerHTML = `
        <div class="error-state">
          <div class="error-icon">🔴</div>
          <div class="error-title">Connection Error</div>
          <div class="error-msg">
            Could not fetch Hot Spot results. The proxy or calottery.com may be temporarily unavailable.<br><br>
            <code>${err.message}</code><br><br>
            Try the Refresh button again in a moment.
          </div>
          <button class="refresh-btn" onclick="loadResults()" style="margin:0 auto;display:flex;">TRY AGAIN</button>
        </div>`;
    } finally {
      btn.disabled = false;
      icon.classList.remove('spin');
    }
  }

  loadResults();
</script>
</body>
</html>
