<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Hot Spot · Live Results</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8001d;
    --red-dim: #8b0011;
    --gold: #ffd000;
    --bg: #0a0a0c;
    --surface: #111115;
    --surface2: #1a1a20;
    --border: #2a2a35;
    --text: #e8e8f0;
    --muted: #666680;
    --ball-size: 36px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,0,29,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,0,29,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 32px 24px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 20px;
    color: white;
    box-shadow: 0 0 20px rgba(232,0,29,0.5);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(232,0,29,0.5); }
    50% { box-shadow: 0 0 35px rgba(232,0,29,0.8); }
  }

  .logo-text {
    display: flex;
    flex-direction: column;
  }

  .logo-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    letter-spacing: 3px;
    line-height: 1;
    color: var(--text);
  }

  .logo-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-bar {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-dot {
    width: 8px; height: 8px;
    background: #00e676;
    border-radius: 50%;
    animation: blink 1.2s infinite;
    flex-shrink: 0;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .refresh-btn {
    background: var(--red);
    color: white;
    border: none;
    padding: 10px 22px;
    font-family: 'Bebas Neue', cursive;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .refresh-btn:hover {
    background: #ff1a35;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(232,0,29,0.4);
  }

  .refresh-btn:active { transform: translateY(0); }

  .refresh-btn:disabled {
    background: var(--red-dim);
    cursor: not-allowed;
    transform: none;
  }

  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls {
    position: relative;
    z-index: 1;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .count-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .count-label span {
    color: var(--gold);
    font-weight: 600;
  }

  .last-updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .results-grid {
    position: relative;
    z-index: 1;
    padding: 0 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .draw-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 90px 120px 1fr auto;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
    animation: slideIn 0.3s ease both;
  }

  .draw-row:hover {
    background: var(--surface2);
    border-color: #3a3a45;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .draw-row:nth-child(1) { animation-delay: 0.02s; }
  .draw-row:nth-child(2) { animation-delay: 0.04s; }
  .draw-row:nth-child(3) { animation-delay: 0.06s; }
  .draw-row:nth-child(4) { animation-delay: 0.08s; }
  .draw-row:nth-child(5) { animation-delay: 0.10s; }

  .draw-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .draw-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
  }

  .draw-time-sub {
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
  }

  .balls-container {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }

  .ball {
    width: var(--ball-size);
    height: var(--ball-size);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--bg);
    background: var(--ball-color, #ccc);
    flex-shrink: 0;
  }

  .bullseye-section {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .bullseye-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  .ball.bullseye {
    background: var(--gold);
    --ball-size: 38px;
    font-size: 13px;
    box-shadow: 0 0 12px rgba(255,208,0,0.5);
  }

  .error-state {
    text-align: center;
    padding: 60px 24px;
    position: relative;
    z-index: 1;
  }

  .error-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .error-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 24px;
    color: var(--red);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .error-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    max-width: 400px;
    margin: 0 auto 24px;
    line-height: 1.6;
  }

  .loading-state {
    text-align: center;
    padding: 60px 24px;
    position: relative;
    z-index: 1;
  }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  .loading-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .col-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-row {
    display: grid;
    grid-template-columns: 90px 120px 1fr auto;
    gap: 16px;
    padding: 8px 18px;
    position: relative;
    z-index: 1;
    margin: 0 24px;
  }

  /* Number coloring based on value ranges */
  .ball[data-range="1"] { background: #ff6b6b; }
  .ball[data-range="2"] { background: #ff9f43; }
  .ball[data-range="3"] { background: #ffd000; }
  .ball[data-range="4"] { background: #a3e635; }
  .ball[data-range="5"] { background: #34d399; }
  .ball[data-range="6"] { background: #22d3ee; }
  .ball[data-range="7"] { background: #818cf8; }
  .ball[data-range="8"] { background: #e879f9; }

  .cors-note {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    padding: 12px 16px;
    margin: 0 24px 16px;
    position: relative;
    z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  .cors-note strong { color: var(--gold); }

  @media (max-width: 700px) {
    .draw-row {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .header-row { display: none; }
    .bullseye-label { writing-mode: horizontal-tb; transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">HS</div>
    <div class="logo-text">
      <div class="logo-title">Hot Spot</div>
      <div class="logo-sub">California Lottery · Results Tracker</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-bar">
      <div class="live-dot"></div>
      <span>DRAWS EVERY 4 MIN</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadResults()">
      <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      REFRESH
    </button>
  </div>
</header>

<div class="controls">
  <div class="count-label">Showing last <span id="countDisplay">—</span> draws</div>
  <div class="last-updated" id="lastUpdated">Not yet loaded</div>
</div>

<div class="header-row">
  <div class="col-header">Draw #</div>
  <div class="col-header">Date / Time</div>
  <div class="col-header">Winning Numbers (1–80)</div>
  <div class="col-header">Bulls-eye</div>
</div>

<div id="main"></div>

<script>
  // Hot Spot = game ID 13 on calottery.com API
  // Routed through corsproxy.io to bypass browser CORS restrictions
  const DIRECT_URL = 'https://www.calottery.com/api/DrawGameApi/DrawGamePastDrawResults/13/1/50';
  const API_URL = 'https://corsproxy.io/?' + encodeURIComponent(DIRECT_URL);

  // Color ranges for balls 1-80
  function ballRange(n) {
    if (n <= 10) return '1';
    if (n <= 20) return '2';
    if (n <= 30) return '3';
    if (n <= 40) return '4';
    if (n <= 50) return '5';
    if (n <= 60) return '6';
    if (n <= 70) return '7';
    return '8';
  }

  function formatDateTime(dateStr) {
    const d = new Date(dateStr);
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    return { date, time };
  }

  function renderBall(num, cls = '') {
    return `<div class="ball ${cls}" data-range="${ballRange(num)}">${num}</div>`;
  }

  function renderDraw(draw, index) {
    const numbers = draw.WinningNumbers || [];
    // Separate regular numbers from bullseye (last one is bullseye if BullseyeNumber exists)
    const regular = numbers.filter(n => !n.IsBullseye);
    const bullseye = draw.BullseyeNumber || numbers.find(n => n.IsBullseye);

    const balls = regular.map(n => renderBall(n.Number || n)).join('');
    const bsNum = bullseye ? (bullseye.Number || bullseye) : null;

    const { date, time } = formatDateTime(draw.DrawDate);

    return `
      <div class="draw-row" style="animation-delay: ${Math.min(index * 0.018, 0.3)}s">
        <div class="draw-number">#${draw.DrawNumber || '—'}</div>
        <div>
          <div class="draw-time">${time}</div>
          <div class="draw-time draw-time-sub">${date}</div>
        </div>
        <div class="balls-container">${balls}</div>
        <div class="bullseye-section">
          <div class="bullseye-label">Bulls-eye</div>
          ${bsNum ? renderBall(bsNum, 'bullseye') : '<div style="color:#444;font-family:IBM Plex Mono,monospace;font-size:11px">—</div>'}
        </div>
      </div>
    `;
  }

  async function loadResults() {
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    const main = document.getElementById('main');

    btn.disabled = true;
    icon.classList.add('spin');

    main.innerHTML = `
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">FETCHING RESULTS...</div>
      </div>
    `;

    try {
      const res = await fetch(API_URL, {
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      const draws = data.PreviousDraws || [];

      document.getElementById('countDisplay').textContent = draws.length;
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });

      if (draws.length === 0) {
        main.innerHTML = `
          <div class="error-state">
            <div class="error-icon">📭</div>
            <div class="error-title">No draws found</div>
            <div class="error-msg">The API returned an empty result set. Try again shortly.</div>
          </div>
        `;
        return;
      }

      main.innerHTML = `<div class="results-grid">${draws.map((d, i) => renderDraw(d, i)).join('')}</div>`;

    } catch (err) {
      main.innerHTML = `
        <div class="error-state">
          <div class="error-icon">🔴</div>
          <div class="error-title">Connection Error</div>
          <div class="error-msg">Could not reach the CA Lottery API. The proxy may be temporarily unavailable — try again in a moment.<br><br><code>${err.message}</code></div>
          <button class="refresh-btn" onclick="loadResults()" style="margin: 0 auto; display:flex;">TRY AGAIN</button>
        </div>
      `;
    } finally {
      btn.disabled = false;
      icon.classList.remove('spin');
    }
  }

  // Load on start
  loadResults();
</script>
</body>
</html>
